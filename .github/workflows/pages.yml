name: Build, verify and publish OneBe
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.publish.outputs.value }}
      note_changed: ${{ steps.note.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify RSS synchronization
        run: node --test tests/note-sync.test.mjs
      - name: Refresh note articles
        id: note
        run: node scripts/sync-note.mjs
      - name: Decide whether to publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          NOTE_CHANGED: ${{ steps.note.outputs.publish }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$NOTE_CHANGED" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm test
        if: steps.publish.outputs.value == 'true'
      - name: Preserve verified note data for the isolated writer
        if: steps.note.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-note-snapshot
          path: src/note-posts.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.publish.outputs.value == 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.publish.outputs.value == 'true'
        with:
          path: dist
  snapshot:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.note_changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-note-snapshot
          path: verified-note
      - name: Save verified note snapshot without executing application dependencies
        run: |
          jq -e 'type == "array" and length > 0 and length <= 3' verified-note/note-posts.json > /dev/null
          cp verified-note/note-posts.json src/note-posts.json
          if ! git diff --quiet -- src/note-posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/note-posts.json
            git commit -m "Refresh published note articles"
            git push origin HEAD:main
          fi
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
